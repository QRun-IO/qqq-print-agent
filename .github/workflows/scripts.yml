# K22-CODE-SH: check repository tooling before merges and releases.
name: scripts

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  virtual-agent:
    name: virtual-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore locked JavaScript tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Restore locked Python tools
        run: uv sync --locked
      - name: Verify script quality gates and rejection paths
        run: |
          uv run --locked --no-sync python .github/scripts/test-script-quality.py
          uv run --locked --no-sync python .github/scripts/check-script-quality.py
          npm run typecheck
          npm run lint
      - name: Verify owned source notices and rejection paths
        run: |
          python3 .github/scripts/test-source-headers.py
          python3 .github/scripts/check-source-headers.py
      - name: Verify virtual-agent protocol and HTTP boundaries
        run: node --test tools/virtual-agent/test/virtual-agent.test.mjs

  powershell:
    name: powershell
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned analyzer and check scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          ./build/Analyze-Scripts.ps1
      - name: Verify analysis and coverage gate rejection paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          $testConfiguration = New-PesterConfiguration
          $testConfiguration.Run.Path = @('build/Assert-Coverage.Tests.ps1', 'build/Analyze-Scripts.Tests.ps1', 'build/Install-Branded.Tests.ps1', 'build/Test-WindowsSdkInventory.Tests.ps1')
          $testConfiguration.Run.Exit = $true
          $testConfiguration.TestResult.Enabled = $true
          $testConfiguration.TestResult.OutputPath = 'TestResults/coverage-gate.xml'
          Invoke-Pester -Configuration $testConfiguration
