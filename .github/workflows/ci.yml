name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      product-version:
        type: string
        default: '0.4.0'
      release-version:
        type: string
        default: '0.4.0-rc.4'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: qqq-print-agent
    steps:
      - name: Checkout agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qqq-print-agent
          persist-credentials: false
      - name: Checkout pinned protocol fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: QRun-IO/qqq-print-protocol
          ref: 42c0d249f81395f00408ec0f92638dcbbf5deb03
          path: qqq-print-protocol
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: qqq-print-agent/global.json
      - name: Locked restore, build and test
        run: ./build/Verify.ps1
      - name: Verify exact Windows SDK inventory and notice bytes
        run: ./build/Test-WindowsSdkInventory.ps1 -VerifyPackages
      - name: Validate branded installer dry run
        run: |
          ./build/Test-BrandedInstaller.ps1
          ./build/Test-PackagingInputs.ps1
      - name: Build unsigned prerelease MSI
        env:
          PRODUCT_VERSION: ${{ inputs.product-version || '0.4.0' }}
          RELEASE_VERSION: ${{ inputs.release-version || '0.4.0-rc.4' }}
        run: |
          ./build/Build-Installer.ps1 -ProductVersion $env:PRODUCT_VERSION -ReleaseVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $source = "artifacts/installer/QqqPrintAgent-$env:PRODUCT_VERSION-x64.msi"
          $name = "QqqPrintAgent-v$env:RELEASE_VERSION-x64.msi"
          Copy-Item -LiteralPath $source -Destination "artifacts/release/$name"
          Copy-Item -LiteralPath build/Install-Branded.ps1 -Destination artifacts/release/Install-Branded.ps1
          Copy-Item -LiteralPath docs/branding.example.json -Destination artifacts/release/branding.example.json
          $hash = (Get-FileHash -LiteralPath "artifacts/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/release/SHA256SUMS -Encoding ascii
          foreach ($file in @('Install-Branded.ps1', 'branding.example.json')) {
            $hash = (Get-FileHash -LiteralPath "artifacts/release/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Add-Content artifacts/release/SHA256SUMS -Encoding ascii
          }
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer
          path: qqq-print-agent/artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload tests and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: qqq-print-agent/TestResults/**
          if-no-files-found: warn
          retention-days: 14

