name: prerelease

on:
  push:
    tags: ['v*-rc.*', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.validate.outputs.product }}
      release: ${{ steps.validate.outputs.release }}
      stable: ${{ steps.validate.outputs.stable }}
    steps:
      - name: Validate release tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo '::error::Run this workflow on an existing vX.Y.Z-rc.N prerelease or vX.Y.Z stable tag.'
            exit 1
          fi
          echo "product=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          # A stable tag has no prerelease suffix and must be signed; a prerelease stays unsigned.
          if [[ -z "${BASH_REMATCH[2]}" ]]; then echo "stable=true" >> "$GITHUB_OUTPUT"; else echo "stable=false" >> "$GITHUB_OUTPUT"; fi
      # A stable tag must be reachable from main, like MarkdownViewr.Windows. Every gate and the signing
      # job depend on this job, so an off-main stable tag is rejected before anything is built or signed.
      # Release-candidate tags keep their existing path and are not checked here.
      - name: Checkout main and tag history
        if: steps.validate.outputs.stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the stable tag to be on main
        if: steps.validate.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      product-version: ${{ needs.version.outputs.product }}
      release-version: ${{ needs.version.outputs.release }}
    permissions:
      contents: read
  security:
    needs: version
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  codeql:
    needs: version
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  scripts:
    needs: version
    uses: ./.github/workflows/scripts.yml
    permissions:
      contents: read
  # Stable tags only. Runs after every gate above, in the protected `release` environment (tags v* only),
  # and signs the owned binaries before the MSI is built and then the MSI itself, using the same Azure
  # Artifact Signing account and profile as MarkdownViewr.Windows. Pull requests never reach this job.
  # Order: verify configuration, locked restore and packaging checks, publish payload, stage owned files,
  # sign, accept only the exact publisher, build MSI from the signed payload, sign and verify the MSI,
  # then assemble the four release files with checksums computed after signing.
  # Lists the client editions (editions/<id>) so the signing job runs once for the generic build and once per edition.
  editions:
    needs: version
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List editions
        id: list
        shell: bash
        run: |
          list=$(find editions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc '[""] + .')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Editions: $list"
  sign:
    if: needs.version.outputs.stable == 'true'
    needs: [version, verify, security, codeql, scripts, editions]
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: true
      matrix:
        edition: ${{ fromJson(needs.editions.outputs.list) }}
    permissions:
      contents: read
      id-token: write # Azure OIDC for the signing identity; no secret or exported key is stored
    defaults:
      run:
        shell: pwsh
    env:
      PRODUCT_VERSION: ${{ needs.version.outputs.product }}
      RELEASE_VERSION: ${{ needs.version.outputs.release }}
      EDITION: ${{ matrix.edition }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_SUBJECT: ${{ vars.ARTIFACT_SIGNING_SUBJECT }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require verified signing configuration
        run: ./build/Assert-ReleaseSigning.ps1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Locked restore and packaging checks
        run: |
          dotnet restore Qqq.PrintAgent.NativeCI.slnx '-p:Platform=x64' --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Test-WindowsSdkInventory.ps1 -VerifyPackages
          ./build/Test-BrandedInstaller.ps1
          ./build/Test-PackagingInputs.ps1
      - name: Resolve the edition
        run: |
          $args = @()
          $prefix = 'QqqPrintAgent'
          if ($env:EDITION) {
            $args = @('-Edition', $env:EDITION)
            $prefix = (Get-Content -LiteralPath "editions/$env:EDITION/edition.json" -Raw | ConvertFrom-Json).assetPrefix
          }
          if ($prefix -cnotmatch '^[A-Za-z][A-Za-z0-9]{1,39}$') { throw 'Invalid edition asset prefix.' }
          "EDITION_ARGS=$($args -join ' ')" | Add-Content -LiteralPath $env:GITHUB_ENV
          "MSI_PATH=artifacts/installer/$prefix-$env:PRODUCT_VERSION-x64.msi" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ARTIFACT_NAME=windows-x64-installer-signed-$(if ($env:EDITION) { $env:EDITION } else { 'generic' })" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Output "Edition: '$env:EDITION' -> $prefix"
      - name: Publish and check the payload
        run: |
          # Hashtable splat: an array splat binds "-Edition gg-forge" positionally (to CertificateThumbprint/TimestampServer) and trips the PublishOnly guard.
          $editionArgs = @{}
          if ($env:EDITION) { $editionArgs['Edition'] = $env:EDITION }
          ./build/Build-Installer.ps1 -ProductVersion $env:PRODUCT_VERSION -ReleaseVersion $env:RELEASE_VERSION -PublishOnly -PayloadDirectory "$env:RUNNER_TEMP/payload" @editionArgs
      - name: Stage owned binaries
        run: ./build/Sign-Release.ps1 -Operation Stage -Kind Payload -Root "$env:RUNNER_TEMP/payload" -Stage "$env:RUNNER_TEMP/sign-payload"
      # The pinned signing action's own installer runs `dotnet tool install --add-source`, which the repository's
      # package source mapping (nuget.config) rejects. Install only the SignCLI version it expects, through that same
      # mapped config, into the exact folder layout the action looks for; it then finds the tool and skips its install.
      - name: Install the pinned SignCLI through the repository NuGet configuration
        run: |
          $version = '0.9.1-beta.26227.3'
          $versions = Join-Path $env:LOCALAPPDATA 'ArtifactSigning\sign'
          $install = Join-Path $versions "sign.$version"
          $dll = Join-Path $install 'tools\net8.0\any\sign.dll'
          if (Test-Path -LiteralPath $dll -PathType Leaf) { Write-Output "SignCLI $version is already installed."; return }
          # Install into a unique temporary folder, then copy the package contents into the expected folder. Nothing
          # already under ArtifactSigning (other versions, shims) is deleted or moved.
          $temp = Join-Path $env:RUNNER_TEMP "signcli-$([guid]::NewGuid().ToString('N'))"
          dotnet tool install sign --version $version --tool-path $temp --configfile (Join-Path $env:GITHUB_WORKSPACE 'nuget.config')
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install sign $version failed." }
          $store = Join-Path $temp ".store\sign\$version\sign\$version"
          if (-not (Test-Path -LiteralPath $store -PathType Container)) { throw "SignCLI $version package content was not found." }
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          Copy-Item -Path (Join-Path $store '*') -Destination $install -Recurse -Force
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "SignCLI $version is missing tools\net8.0\any\sign.dll." }
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign owned binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}/sign-payload
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Accept signed binaries for the exact publisher
        run: ./build/Sign-Release.ps1 -Operation Apply -Kind Payload -Root "$env:RUNNER_TEMP/payload" -Stage "$env:RUNNER_TEMP/sign-payload" -ExpectedSubject $env:ARTIFACT_SIGNING_SUBJECT
      - name: Build MSI from the signed payload
        run: |
          # Hashtable splat: an array splat binds "-Edition gg-forge" positionally (to CertificateThumbprint/TimestampServer) and trips the PublishOnly guard.
          $editionArgs = @{}
          if ($env:EDITION) { $editionArgs['Edition'] = $env:EDITION }
          ./build/Build-Installer.ps1 -ProductVersion $env:PRODUCT_VERSION -ReleaseVersion $env:RELEASE_VERSION -SkipPublish -PayloadDirectory "$env:RUNNER_TEMP/payload" @editionArgs
      - name: Stage MSI
        run: ./build/Sign-Release.ps1 -Operation Stage -Kind Msi -Root $env:MSI_PATH -Stage "$env:RUNNER_TEMP/sign-msi"
      - name: Sign MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}/sign-msi
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Accept signed MSI for the exact publisher
        run: ./build/Sign-Release.ps1 -Operation Apply -Kind Msi -Root $env:MSI_PATH -Stage "$env:RUNNER_TEMP/sign-msi" -ExpectedSubject $env:ARTIFACT_SIGNING_SUBJECT
      - name: Upload the signed installer of this edition
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.MSI_PATH }}
          if-no-files-found: error
          retention-days: 14
  # Gathers the signed generic and edition installers, verifies each signature again, and writes the release
  # files with one SHA256SUMS computed after signing. Nothing is built or signed here.
  assemble:
    if: needs.version.outputs.stable == 'true'
    needs: [version, sign]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the signed installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-x64-installer-signed-*
          path: artifacts/installer
          merge-multiple: true
      - name: Assemble signed release files and checksums
        env:
          PRODUCT_VERSION: ${{ needs.version.outputs.product }}
          RELEASE_VERSION: ${{ needs.version.outputs.release }}
          ARTIFACT_SIGNING_SUBJECT: ${{ vars.ARTIFACT_SIGNING_SUBJECT }}
        run: ./build/Package-Release.ps1 -AssembleOnly -ProductVersion $env:PRODUCT_VERSION -ReleaseVersion $env:RELEASE_VERSION -ExpectedPublisherSubject $env:ARTIFACT_SIGNING_SUBJECT
      - name: Upload signed installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer-signed
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [version, verify, security, codeql, scripts, sign, assemble]
    # Every gate must pass; the signing and assembly jobs may be skipped only for an unsigned prerelease tag.
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.verify.result == 'success'
      && needs.security.result == 'success' && needs.codeql.result == 'success' && needs.scripts.result == 'success'
      && (needs.version.outputs.stable != 'true' && needs.sign.result == 'skipped' && needs.assemble.result == 'skipped' || needs.version.outputs.stable == 'true' && needs.sign.result == 'success' && needs.assemble.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.version.outputs.stable == 'true' && 'windows-x64-installer-signed' || 'windows-x64-installer' }}
          path: release
      - name: Verify packaged checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish signed stable release
        if: needs.version.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Windows x64 release of QQQ Print Agent for QQQ 4.1+. The MSI and the first-party service, companion and command-line binaries are Authenticode-signed with SHA256 and an RFC3161 timestamp by the project's Azure Artifact Signing publisher identity.

          Verify the MSI against SHA256SUMS and its GitHub provenance attestation before installing; every asset was built and tested by this workflow after all security, CodeQL and script gates passed, and the checksums were generated after signing.

          This client requires QQQ's semantic printing extension >=2.0.0 <3.0.0 and standard QQQ sign-in; selected-media jobs need printing 2.3+. Upgrade the server first. Existing pairings and history are preserved.

          See CHANGELOG.md, docs/INSTALLATION.md and docs/ACCEPTANCE.md in the tagged source for scope, evidence and limitations. Spool acceptance alone does not establish physical output.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --latest --title "QQQ Print Agent $RELEASE_TAG" --notes-file release-notes.md
      - name: Publish unsigned prerelease
        if: needs.version.outputs.stable != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          This is an unsigned Windows x64 prerelease of QQQ Print Agent for QQQ 4.1+.

          Assets were built and tested by this workflow. Verify the MSI against SHA256SUMS before installing. No Authenticode signature or production qualification is claimed.

          This client requires QQQ's semantic printing extension >=2.0.0 <3.0.0 and standard QQQ sign-in. When upgrading from 0.2, upgrade the server first: native API 2.0 makes a synchronized authenticated WebSocket mandatory for claims. An existing 0.3 server remains compatible with this client follow-up. Existing pairings and history are preserved; unbound devices require explicit account association.

          New in 0.4.0: optional printer-media selection and 4 x 2 / 4 x 1 test-label choices. Printer profiles describe configured defaults, not physical stock sensing; jobs refuse a selected profile whose revision has drifted. Each job writes a phase-timing log line. Ordered numeric executable versions allow normal upgrades between release candidates. Upgrade the server first for selected-media jobs. The local rc.3 build of the same printing runtime passed installation and the operator's 4 x 1 test; Letter and 4 x 6 output were previously accepted. Physical 4 x 2 testing is deferred. This remains an unsigned prerelease, with no GA or stable 1.0 claim.

          New in 0.3.2: a successful MSI result is accepted only when app, service and CLI have the requested release and identical full build versions. Missing, unreadable or mixed builds report an inconsistent installation without claiming rollback. The SDK credit references Microsoft's separate terms and installed notices. The native test host now matches production's PerMonitorV2 DPI declaration while retaining unelevated execution.

          New in 0.3.1: the footer shows explicit WebSocket state, a server-settings link, live QQQ service upload/download payload rates and totals since service start. Lightweight local observations add no QQQ job/control polling. Windows-normalized startup account names are accepted only when they resolve to the exact expected SID; this preference controls the tray companion, independently of the automatic print service.

          Known issue: a post-print native LayoutCycleException was observed in the 0.3.0 companion. The original trigger remains unreproduced despite nonprinting native geometry/dialog/refresh tests. This follow-up logs that exact fatal exception and permits normal WinUI termination rather than leaving an input-dead window; the service continues and the operator can reopen the companion. This is mitigation, not an underlying layout fix. Actual fatal handling and natural termination were verified with an intentionally cycling native Panel in an isolated nonprinting host; that test does not reproduce the original post-print trigger.

          New in 0.3: persistent outbound authenticated WSS carries controls, commands, receipts, status and job notifications, with no job/control polling or fallback. Documents stream separately over same-origin HTTPS into protected staging. Administrator settings bound document size, copies, aggregate bandwidth, staging, queues, concurrency, liveness and timeouts; defaults include 100 MiB PDF, 20 MiB ZPL and one download/print lane. Durable reconnect reconciliation preserves receipts and prevents blind resubmission of uncertain jobs. The Jobs view adds inline expansion and actions with sortable, bounded history.

          Existing features include standard QQQ sign-in and protected service sessions, PDF/ZPL printing and warehouse diagnostic profiles, exact owned spool cancellation, synchronized device/printer profiles, configurable logs, customer branding, AppKit settings/logs/update prompts, machine-wide MSI updates, tray status and explicit printer exposure. Replacement pairing and recovery from damaged saved credentials preserve history and printer choices without silently enabling printing.

          The published 0.3.2 MSI was reached by a real in-app update from 0.3.1 with pairing, printer profiles and local receipts preserved, and its service restored the native QQQ session and WebSocket. The operator confirmed successful test prints on 0.3.1. Configured provider/browser callbacks also need end-to-end qualification against a compatible native-session API. See docs/ACCEPTANCE.md for version-specific evidence and remaining limits. Spool acceptance alone does not establish physical output or scanner readability; no stable 1.0 readiness is claimed.

          See CHANGELOG.md, docs/INSTALLATION.md and docs/ACCEPTANCE.md in the tagged source for scope and limitations.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "QQQ Print Agent $RELEASE_TAG" --notes-file release-notes.md
