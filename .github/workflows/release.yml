name: prerelease

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.validate.outputs.product }}
      release: ${{ steps.validate.outputs.release }}
    steps:
      - name: Validate prerelease tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            echo '::error::Run this workflow on an existing vX.Y.Z-rc.N tag.'
            exit 1
          fi
          echo "product=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      product-version: ${{ needs.version.outputs.product }}
      release-version: ${{ needs.version.outputs.release }}
    permissions:
      contents: read
  security:
    needs: version
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  codeql:
    needs: version
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  scripts:
    needs: version
    uses: ./.github/workflows/scripts.yml
    permissions:
      contents: read
  publish:
    needs: [version, verify, security, codeql, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-installer
          path: release
      - name: Verify packaged checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish unsigned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          This is an unsigned Windows x64 prerelease of QQQ Print Agent for QQQ 4.1+.

          Assets were built and tested by this workflow. Verify the MSI against SHA256SUMS before installing. No Authenticode signature or production qualification is claimed.

          Features: QQQ-branded warehouse diagnostic documents with native Letter/A4/4 × 6-inch PDF and 203/300/600-dpi ZPL profile choices, label-aware defaults with operator resolution verification, sortable printer and job tables, inline printer details, double-click settings and job dialogs, bounded history pages with creation-time ordering, synchronized computer/printer profiles, daily log limits and clearing, same-installer customer branding, native Windows navigation, AppKit logs/settings/update prompts, verified machine-wide MSI updates, tray status, explicit printer exposure, reconnect and service controls, searchable job history with test/retry/cancel/review actions, bounded printer workers, outbound cloud polling, PDF and ZPL spool submission, durable receipts and protected service credentials. See docs/ACCEPTANCE.md for version-specific installed checks, diagnostic spool submissions, physical-output confirmation and remaining qualification limits. Spool acceptance alone does not establish physical output or scanner readability.

          See CHANGELOG.md, docs/INSTALLATION.md and docs/ACCEPTANCE.md in the tagged source for scope and limitations.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "QQQ Print Agent $RELEASE_TAG" --notes-file release-notes.md
