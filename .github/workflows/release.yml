name: prerelease

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.validate.outputs.product }}
      release: ${{ steps.validate.outputs.release }}
    steps:
      - name: Validate prerelease tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            echo '::error::Run this workflow on an existing vX.Y.Z-rc.N tag.'
            exit 1
          fi
          echo "product=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      product-version: ${{ needs.version.outputs.product }}
      release-version: ${{ needs.version.outputs.release }}
    permissions:
      contents: read
  security:
    needs: version
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  codeql:
    needs: version
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  scripts:
    needs: version
    uses: ./.github/workflows/scripts.yml
    permissions:
      contents: read
  publish:
    needs: [version, verify, security, codeql, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-installer
          path: release
      - name: Verify packaged checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish unsigned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          This is an unsigned Windows x64 prerelease of QQQ Print Agent for QQQ 4.1+.

          Assets were built and tested by this workflow. Verify the MSI against SHA256SUMS before installing. No Authenticode signature or production qualification is claimed.

          This client requires QQQ's semantic printing extension >=2.0.0 <3.0.0 and standard QQQ sign-in. When upgrading from 0.2, upgrade the server first: native API 2.0 makes a synchronized authenticated WebSocket mandatory for claims. An existing 0.3 server remains compatible with this client follow-up. Existing pairings and history are preserved; unbound devices require explicit account association.

          New in 0.3.1: the footer shows explicit WebSocket state, a server-settings link, live QQQ service upload/download payload rates and totals since service start. Lightweight local observations add no QQQ job/control polling. Windows-normalized startup account names are accepted only when they resolve to the exact expected SID; this preference controls the tray companion, independently of the automatic print service.

          Known issue: a post-print native LayoutCycleException was observed in the 0.3.0 companion. The original trigger remains unreproduced despite nonprinting native geometry/dialog/refresh tests. This follow-up logs that exact fatal exception and permits normal WinUI termination rather than leaving an input-dead window; the service continues and the operator can reopen the companion. This is mitigation, not an underlying layout fix. Actual fatal handling and natural termination were verified with an intentionally cycling native Panel in an isolated nonprinting host; that test does not reproduce the original post-print trigger.

          New in 0.3: persistent outbound authenticated WSS carries controls, commands, receipts, status and job notifications, with no job/control polling or fallback. Documents stream separately over same-origin HTTPS into protected staging. Administrator settings bound document size, copies, aggregate bandwidth, staging, queues, concurrency, liveness and timeouts; defaults include 100 MiB PDF, 20 MiB ZPL and one download/print lane. Durable reconnect reconciliation preserves receipts and prevents blind resubmission of uncertain jobs. The Jobs view adds inline expansion and actions with sortable, bounded history.

          Existing features include standard QQQ sign-in and protected service sessions, PDF/ZPL printing and warehouse diagnostic profiles, exact owned spool cancellation, synchronized device/printer profiles, configurable logs, customer branding, AppKit settings/logs/update prompts, machine-wide MSI updates, tray status and explicit printer exposure. Replacement pairing and recovery from damaged saved credentials preserve history and printer choices without silently enabling printing.

          The published 0.3.0 local cohort passed state preservation and service restart/restoration checks, with fresh laser PDF and Zebra ZPL spool receipts. This 0.3.1 client still requires its own installed UI and physical-output acceptance. Configured authentication providers and installed browser callbacks also require end-to-end qualification, including provider renewal and permissions deployment. Source tests do not establish those outcomes. See docs/ACCEPTANCE.md for version-specific evidence and remaining limits. Spool acceptance alone does not establish physical output or scanner readability; no stable 1.0 readiness is claimed.

          See CHANGELOG.md, docs/INSTALLATION.md and docs/ACCEPTANCE.md in the tagged source for scope and limitations.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "QQQ Print Agent $RELEASE_TAG" --notes-file release-notes.md
