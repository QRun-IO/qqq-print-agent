# CodeQL static analysis (K22-CI-22): security-extended queries for C# (a manual x64
# build of the solution) and for the workflows themselves, blocking high severity.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

  workflow_call:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read         # check out the code
      security-events: write # upload CodeQL results to code scanning
    with:
      languages: '["csharp", "actions"]'
      build-mode: manual
      build-command: dotnet build src/Qqq.PrintAgent/Qqq.PrintAgent.csproj -p:Platform=x64 && dotnet build src/Qqq.PrintAgent.Service/Qqq.PrintAgent.Service.csproj -p:Platform=x64 && dotnet build src/Qqq.PrintAgent.Cli/Qqq.PrintAgent.Cli.csproj -p:Platform=x64
      runs-on: windows-latest
      setup-dotnet: true

